name: Publish site to the gh-pages branch

# GitHub Pages serves the gh-pages branch (branch source). This job copies site/ there on every push to main.

on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push site/ to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix site -b gh-pages-new
          git push --force origin gh-pages-new:gh-pages
